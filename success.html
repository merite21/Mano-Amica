<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grazie — Mano Amica</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=1788168268">
</head>
<body>

  <div class="topbar">
    <a href="index.html" class="logo">Mano Amica</a>
  </div>

  <section class="hero" style="min-height:100vh; justify-content:center; align-items:flex-start;">
    <span class="hero-eyebrow" data-i18n="ok_eyebrow">Grazie di cuore</span>
    <h1 data-i18n="ok_h1">La tua donazione è arrivata.</h1>
    <p class="hero-sub" data-i18n="ok_sub">Grazie al tuo gesto, oggi qualcuno riceverà un pasto caldo, una cura o un ascolto in più. Riceverai a breve una email di conferma.</p>
    <div class="hero-cta">
      <a href="index.html" class="btn btn-solid" data-i18n="ok_home">Torna alla home</a>
      <a href="come-aiutiamo.html" class="btn btn-line" data-i18n="ok_projects">Scopri i progetti</a>
    </div>
    <p id="sim-note" style="margin-top:24px; font-size:.8rem; color:rgba(243,236,220,.4); display:none;"></p>
  </section>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get('simulated') === '1') {
    const note = document.getElementById('sim-note');
    const amount = params.get('amount');
    const method = params.get('method');
    note.textContent = `[Simulazione — nessun pagamento reale] Importo: ${amount} € · Metodo: ${method}`;
    note.style.display = 'block';
  }
</script>

<script src="assets/script.js?v=1788168268"></script>
</body>
</html>
